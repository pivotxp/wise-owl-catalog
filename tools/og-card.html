<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG card source — 1200×630</title>
<!--
  Source for assets/img/og-cover.jpg — the link-preview card shown in Slack,
  iMessage, LinkedIn and email. Regenerate after changing the client name:

      node tools/make-og.mjs

  The previous card was a hand-made image that still read "PREPARED FOR
  JACK MORTON", which is the first thing a recipient saw. Rendering it from
  markup means the card can never drift from the client it was built for.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<style>
@font-face{font-family:Gyst;src:url(../assets/fonts/Gyst-Bold.otf) format('opentype');font-weight:700}
@font-face{font-family:Gyst;src:url(../assets/fonts/Gyst-Medium.otf) format('opentype');font-weight:500}
:root{
  --bg:#0C2412; --ink:#FFFEF7; --muted:#AEC6B4; --dim:#8AA791;
  --mint:#01A94F; --mint-lt:#5FDD9A;
  --disp:"Gyst",Georgia,serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:
    radial-gradient(900px 460px at 88% -12%,rgba(1,169,79,.16),transparent 60%),
    radial-gradient(700px 400px at -8% 112%,rgba(1,169,79,.08),transparent 60%),
    var(--bg);
  color:var(--ink);font-family:var(--body);position:relative;
  display:flex;flex-direction:column;justify-content:center;
  padding:0 78px;-webkit-font-smoothing:antialiased}
/* same dot field as the site cover */
body::after{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(rgba(174,198,180,.11) 1px,transparent 1px);
  background-size:26px 26px;
  mask-image:radial-gradient(560px 420px at 84% 26%,#000 18%,transparent 74%);
  -webkit-mask-image:radial-gradient(560px 420px at 84% 26%,#000 18%,transparent 74%)}
.brand{position:absolute;top:52px;left:78px;display:flex;align-items:center;gap:16px}
.brand img{height:30px;width:auto;display:block}
.brand .x{font-size:15px;color:var(--dim)}
.brand .mark{height:22px;width:auto;opacity:.95}
.eyebrow{font-weight:600;font-size:13px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--mint-lt);margin-bottom:26px}
h1{font-family:var(--disp);font-weight:700;font-size:104px;line-height:.92;
  letter-spacing:-.015em;max-width:13ch}
h1 em{font-style:normal;color:var(--mint)}
.prep{margin-top:34px;display:flex;align-items:center;gap:18px;
  font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-variant-numeric:tabular-nums lining-nums}
.prep::before{content:"";width:46px;height:1px;background:var(--mint);flex:none}
.prep b{color:var(--ink);font-weight:600}
.foot{position:absolute;left:78px;bottom:50px;right:78px;display:flex;
  justify-content:space-between;align-items:baseline;
  font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.foot .demos{color:var(--mint-lt)}
</style>
</head>
<body>

<div class="brand">
  <img src="../assets/img/pivot-logo.png" alt="PivotXP">
  <span class="x">×</span>
  <img class="mark" src="../assets/img/wmevents-mark.svg" alt="">
</div>

<p class="eyebrow">PivotXP · Experiential Technology</p>
<h1>The Experience <em>Catalog</em></h1>
<p class="prep">Prepared for <b>WM&nbsp;Events</b> · August 2026</p>

<div class="foot">
  <span>Capture · AI · Takeaways · Gamification</span>
  <span class="demos">Three live demos inside →</span>
</div>

</body>
</html>
