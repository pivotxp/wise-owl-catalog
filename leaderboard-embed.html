<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equinox Music Trivia Leaderboard — Live Demo</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:Gyst;src:url(assets/fonts/Gyst-Bold.otf) format('opentype');font-weight:700;font-display:swap}
@font-face{font-family:Gyst;src:url(assets/fonts/Gyst-Medium.otf) format('opentype');font-weight:500;font-display:swap}
@font-face{font-family:Gyst;src:url(assets/fonts/Gyst-Light.otf) format('opentype');font-weight:300;font-display:swap}
:root{--mint:#01A94F}
@font-face{font-family:'Ka1';src:url('assets/ntt/ka1.ttf') format('truetype')}
*{margin:0;padding:0;box-sizing:border-box}
/* NOT transparent: an iframe paints its own white canvas under a transparent document,
   which showed as a bright slab inside the dark catalog page. */
body{background:#0C2412;display:flex;justify-content:center;padding:6px 0 0;font-family:system-ui,sans-serif}
.stage{display:flex;flex-direction:column;align-items:center}

/* ---------- touchscreen TV unit (matches Polaris demo) ---------- */
.tv{position:relative;padding:clamp(10px,1.6vw,16px);border-radius:14px;
  background:linear-gradient(150deg,#23282c 0%,#101315 55%,#181c1f 100%);
  border:1px solid #383f44;border-bottom-color:#22272a;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 24px 70px rgba(0,0,0,.6)}
.tv::after{content:"";position:absolute;left:50%;bottom:5px;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--mint);opacity:.8;box-shadow:0 0 6px var(--mint)}
.frame{position:relative;width:min(400px,88vw);aspect-ratio:9/16;background:#333;border-radius:4px;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.9);container-type:size}
.frame::after{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;border-radius:4px;
  background:linear-gradient(112deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.02) 26%,transparent 40%)}
.stand{display:flex;flex-direction:column;align-items:center;width:min(400px,88vw)}
.stand .neck{width:14%;height:clamp(34px,5vw,54px);
  background:linear-gradient(90deg,#0d1012,#272c30 45%,#33393e 50%,#272c30 55%,#0d1012);
  clip-path:polygon(18% 0,82% 0,100% 100%,0 100%)}
.stand .base{width:52%;height:clamp(10px,1.4vw,14px);border-radius:4px 4px 8px 8px;
  background:linear-gradient(180deg,#2c3236,#0e1113);border:1px solid #383f44;border-top:none}
.stand .floor{width:78%;height:16px;margin-top:6px;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%,rgba(0,0,0,.55),transparent 70%)}

/* ---------- leaderboard screen (faithful to the booth build) ---------- */
.screen{position:absolute;inset:0;color:#fff;
  background:#333 url('assets/ntt/leaderboard_bg.png') center/cover no-repeat}
#leaderboard-container{position:absolute;top:36%;left:0;right:0;bottom:4%;
  display:flex;flex-direction:column;justify-content:flex-start;gap:1.55cqh;align-items:center}
.entry{display:flex;align-items:baseline;width:88cqw;font-family:'Ka1',monospace;font-size:3.55cqw;color:#fff;
  text-shadow:2px 2px 0 rgba(0,0,0,.6);transition:filter .3s}
.entry .rank{width:12cqw;flex:none;text-align:right}
.entry .name{flex:1;padding:0 3cqw;text-align:left;white-space:nowrap;overflow:hidden}
.entry .score{width:22cqw;flex:none;text-align:right}
.entry.fresh{animation:freshglow 2.4s ease-out}
@keyframes freshglow{
  0%{filter:drop-shadow(0 0 8px #FFD54A) brightness(1.9)}
  100%{filter:none}}
.cursor::after{content:"█";animation:blink .7s steps(1) infinite;font-size:.9em}
@keyframes blink{50%{opacity:0}}

/* sim chip */
.sim{position:absolute;top:2.5%;left:4%;font-family:'Ka1',monospace;font-size:1.9cqw;color:#FFD54A;
  border:1px solid rgba(255,213,74,.6);border-radius:3px;padding:.5cqw 1.3cqw;text-shadow:1px 1px 0 rgba(0,0,0,.6)}

/* live chip */
.live{position:absolute;top:2.5%;right:4%;display:flex;align-items:center;gap:1.6cqw;
  font-family:'Ka1',monospace;font-size:2.2cqw;color:#fff;text-shadow:1px 1px 0 rgba(0,0,0,.6)}
.live i{width:2cqw;height:2cqw;border-radius:50%;background:#FF4D4D;animation:blink 1.4s steps(1) infinite}

/* PLAY NOW overlay (shown briefly, as on site) */
#game-url-overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.78);transition:opacity .6s ease}
#game-url-overlay.hide{opacity:0;pointer-events:none}
.overlay-card{text-align:center;padding:7cqw 8cqw;border:1.2cqw solid #fff;border-radius:3cqw;background:rgba(0,0,0,.55);max-width:84cqw}
.overlay-title{font-family:'Ka1',monospace;font-size:6.5cqw;letter-spacing:.22em;margin-bottom:4cqw}
.overlay-sub{font-family:'Ka1',monospace;font-size:3cqw;line-height:1.8;color:#FFD54A}
</style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%2301A94F' stroke-width='10'/%3E%3C/svg%3E">
</head>
<body>
<div id="topbar" style="display:none;align-items:center;justify-content:space-between;width:100%;max-width:460px;margin:0 auto .8rem;padding:0 .2rem;font-family:ui-monospace,monospace;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase">
  <a href="index.html#proof" style="color:#96A8A0;text-decoration:none">← Back to the catalog</a>
  <span style="color:#7C8F86">Equinox Music Trivia · Live demo</span>
</div>
<div class="stage">
  <div class="tv">
    <div class="frame">
      <div class="screen">
        <div class="live"><i></i>LIVE</div>
        <div class="sim">SIMULATED</div>
        <div id="leaderboard-container"></div>
        <div id="game-url-overlay">
          <div class="overlay-card">
            <div class="overlay-title">PLAY NOW</div>
            <div class="overlay-sub">DEMO MODE<br>SIMULATED SCORES<br>ROLLING IN</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="stand"><div class="neck"></div><div class="base"></div><div class="floor"></div></div>
</div>

<script>
/* ---- identical arcade typewriter mechanic to the booth build ---- */
const N=10, TYPE_SPEED_MS=40;
const container=document.getElementById('leaderboard-container');
for(let i=1;i<=N;i++){const d=document.createElement('div');d.className='entry';d.id='entry'+i;container.appendChild(d)}
const displayed=Array(N).fill(null), typingTokens=Array(N).fill(0);

function typeRow(entryDiv,idx,rank,name,score,fresh){
  const token=++typingTokens[idx];
  entryDiv.innerHTML='<span class="rank">'+rank+'.</span> <span class="name"></span> <span class="score"></span>';
  entryDiv.classList.remove('fresh');
  if(fresh){void entryDiv.offsetWidth;entryDiv.classList.add('fresh')}
  const nameSpan=entryDiv.querySelector('.name'),scoreSpan=entryDiv.querySelector('.score');
  const nameText=String(name),scoreText=String(score);
  let ni=0,si=0;
  nameSpan.classList.add('cursor');
  (function tick(){
    if(token!==typingTokens[idx])return;
    if(ni<nameText.length){nameSpan.textContent+=nameText.charAt(ni++);setTimeout(tick,TYPE_SPEED_MS)}
    else if(si<scoreText.length){nameSpan.classList.remove('cursor');scoreSpan.classList.add('cursor');scoreSpan.textContent+=scoreText.charAt(si++);setTimeout(tick,TYPE_SPEED_MS)}
    else scoreSpan.classList.remove('cursor');
  })();
}
function render(board,freshName){
  for(let i=0;i<N;i++){
    const entryDiv=document.getElementById('entry'+(i+1));
    const incoming=board[i]||null, cur=displayed[i];
    const changed=(!cur!== !incoming)||(incoming&&cur&&(cur.name!==incoming.name||cur.score!==incoming.score));
    if(changed){
      if(incoming)typeRow(entryDiv,i,i+1,incoming.name,incoming.score,incoming.name===freshName);
      else entryDiv.innerHTML='<span class="rank">'+(i+1)+'.</span>';
      displayed[i]=incoming?{...incoming}:null;
    }
  }
}

/* ---- score-submission simulator (replaces the booth POST /api/vendor/submit feed) ---- */
const FIRST=['Konstantinos','Sadie','Marcus','June','Tyler','Reba','Dallas','Wynn','Carrie','Hank','Loretta','Garth','Shania','Colter','Lainey','Morgan','Dolly','Cash','Waylon','Tanya','Randy','Patsy','Boone','Ellie','Cody','Faith','Jolene','Travis','Maren','Sturgill'];
const LAST='ABCDEFGHJKLMNPRSTVW';
const used=new Set();
function newPlayer(){
  if(used.size>400)used.clear();
  for(let t=0;t<40;t++){
    const n=FIRST[Math.floor(Math.random()*FIRST.length)]+' '+LAST.charAt(Math.floor(Math.random()*LAST.length))+'.';
    if(!used.has(n)){used.add(n);return n}
  }
  return 'Guest '+Math.floor(Math.random()*900+100);
}
function newScore(){ /* weighted like real trivia: most mid-pack, rare monsters */
  const r=Math.random();
  const v=r<.6?400+Math.random()*700:r<.9?900+Math.random()*700:1500+Math.random()*600;
  return Math.round(v/25)*25;
}
let board=[];
function submit(name,score){
  const existing=board.find(e=>e.name===name);
  if(existing){if(score>existing.score)existing.score=score;else return}
  else board.push({name,score});
  board.sort((a,b)=>b.score-a.score);
  board=board.slice(0,N);
}

/* seed the board with a day's worth of play, staggered so rows type in one after another */
const seedCount=7;let seeded=0;
(function seedNext(){
  if(seeded>=seedCount)return;
  const nm=newPlayer();submit(nm,newScore());render(board,nm);seeded++;
  setTimeout(seedNext,900);
})();

/* then new games finish every few seconds, forever */
(function loop(){
  setTimeout(()=>{
    if(simPaused)return loop();
    const replay=board.length>4&&Math.random()<.18;
    const nm=replay?board[Math.floor(Math.random()*board.length)].name:newPlayer();
    const before=JSON.stringify(board);
    submit(nm,newScore());
    if(JSON.stringify(board)!==before)render(board,nm);
    loop();
  },3500+Math.random()*4500);
})();

/* parent catalog pauses the sim when scrolled off-screen */
let simPaused=false;
addEventListener('message',e=>{
  if(e.origin!==location.origin)return;   // only the hosting catalog drives us
  if(!e.data||!e.data.cmd)return;
  simPaused=(e.data.cmd==='pause');
});

/* PLAY NOW overlay, shown ~5s like on site */
setTimeout(()=>{
  const o=document.getElementById('game-url-overlay');
  o.classList.add('hide');setTimeout(()=>o.remove(),700);
},5000);
</script>
<script>if(window.self===window.top){const tb=document.getElementById("topbar");tb.style.display="flex";document.body.style.flexDirection="column";document.body.style.padding="14px 10px"}</script>
</body>
</html>
